name = "nexyfab-job-orchestrator"
main = "src/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
binding = "CAD_JOB_QUEUE"
queue = "nexyfab-cad-jobs"

[[queues.producers]]
binding = "CAD_JOB_DLQ"
queue = "nexyfab-cad-jobs-dlq"

[[queues.consumers]]
queue = "nexyfab-cad-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 30
dead_letter_queue = "nexyfab-cad-jobs-dlq"
max_concurrency = 10

[[durable_objects.bindings]]
name = "JOB_LEDGER"
class_name = "CadJobLedger"

[[durable_objects.bindings]]
name = "EXACT_COMPUTE"
class_name = "ExactComputeContainer"

[[durable_objects.bindings]]
name = "OPENSCAD_COMPUTE"
class_name = "OpenScadComputeContainer"

[[durable_objects.bindings]]
name = "FEA_COMPUTE"
class_name = "FeaComputeContainer"

[[durable_objects.bindings]]
name = "INTEROP_COMPUTE"
class_name = "InteropComputeContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CadJobLedger"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ExactComputeContainer", "OpenScadComputeContainer", "FeaComputeContainer", "InteropComputeContainer"]

[[containers]]
name = "nexyfab-occt-exact"
class_name = "ExactComputeContainer"
image = "../../containers/occt-exact/Dockerfile"
image_build_context = "../.."
max_instances = 8
  [containers.instance_type]
  vcpu = 1
  memory_mib = 2048
  disk_mb = 4000

[[containers]]
name = "nexyfab-openscad"
class_name = "OpenScadComputeContainer"
image = "../../containers/openscad/Dockerfile"
image_build_context = "../.."
max_instances = 8
  [containers.instance_type]
  vcpu = 1
  memory_mib = 1024
  disk_mb = 2000

[[containers]]
name = "nexyfab-fea"
class_name = "FeaComputeContainer"
image = "../../containers/fea/Dockerfile"
image_build_context = "../.."
max_instances = 4
  [containers.instance_type]
  vcpu = 2
  memory_mib = 4096
  disk_mb = 4000

[[containers]]
name = "nexyfab-ifc-step"
class_name = "InteropComputeContainer"
image = "../../containers/ifc-step/Dockerfile"
image_build_context = "../.."
max_instances = 8
  [containers.instance_type]
  vcpu = 1
  memory_mib = 2048
  disk_mb = 4000

[[workflows]]
name = "nexyfab-cad-job-workflow"
binding = "CAD_JOB_WORKFLOW"
class_name = "CadJobWorkflow"

[vars]
ENVIRONMENT = "staging-disabled"
BUILD_ID = "NOT_DEPLOYED"

# CORE_API_ORIGIN remains the relational authority. External compute origins
# are optional Railway fallbacks; Cloudflare Container bindings are primary.
# JOB_INGRESS_SECRET, CORE_API_SHARED_SECRET, COMPUTE_SHARED_SECRET and all
# worker/kernel identity values are Wrangler secrets.

[observability]
enabled = true
