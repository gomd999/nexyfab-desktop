name: Release Desktop App

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: win-x64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact_name: mac-aarch64
          - platform: macos-13
            args: '--target x86_64-apple-darwin'
            artifact_name: mac-x64
          - platform: ubuntu-22.04
            artifact_name: linux-x64

    runs-on: ${{ matrix.platform }}
    environment:
      name: nexyfab.com / production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate release version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(node scripts/release/desktop-release-metadata.mjs version --ref "$REF_NAME" --input "$INPUT_VERSION")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args || '' }}

      - name: Find built artifact
        id: artifact
        shell: bash
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$MATRIX_PLATFORM" = "windows-latest" ]; then
            FILE=$(find src-tauri/target -name "*.msi" -print -quit)
          elif [[ "$MATRIX_PLATFORM" == macos* ]]; then
            FILE=$(find src-tauri/target -name "*.dmg" -print -quit)
          else
            FILE=$(find src-tauri/target -name "*.AppImage" -print -quit)
          fi
          test -n "$FILE"
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
          SIG_FILE="${FILE}.sig"
          if [ -f "$SIG_FILE" ]; then
            echo "sig_file=$SIG_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          ARTIFACT_FILE: ${{ steps.artifact.outputs.file }}
          ARTIFACT_FILENAME: ${{ steps.artifact.outputs.filename }}
          SIGNATURE_FILE: ${{ steps.artifact.outputs.sig_file }}
        shell: bash
        run: |
          case "$R2_ENDPOINT" in https://*) ;; *) echo "R2_ENDPOINT must use HTTPS" >&2; exit 1 ;; esac
          test -n "$R2_BUCKET"
          aws s3 cp "$ARTIFACT_FILE" \
            "s3://$R2_BUCKET/releases/$RELEASE_VERSION/$ARTIFACT_FILENAME" \
            --endpoint-url "$R2_ENDPOINT"

          if [ -n "$SIGNATURE_FILE" ]; then
            aws s3 cp "$SIGNATURE_FILE" \
              "s3://$R2_BUCKET/releases/$RELEASE_VERSION/$ARTIFACT_FILENAME.sig" \
              --endpoint-url "$R2_ENDPOINT"
          fi

      - name: Upload .sig file as artifact
        if: steps.artifact.outputs.sig_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sig-${{ matrix.artifact_name }}
          path: ${{ steps.artifact.outputs.sig_file }}
          retention-days: 7

  register-release:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: nexyfab.com / production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Download all .sig artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: sigs/
          pattern: sig-*
          merge-multiple: false

      - name: Build release payload
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node scripts/release/desktop-release-metadata.mjs payload \
            --ref "$REF_NAME" \
            --input "$INPUT_VERSION" \
            --sigs sigs \
            --output release-payload.json

      - name: Register release in DB
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        shell: bash
        run: |
          case "$APP_URL" in https://*) ;; *) echo "APP_URL must use HTTPS" >&2; exit 1 ;; esac
          test -n "$ADMIN_SECRET"
          curl --fail-with-body --silent --show-error -X POST "${APP_URL%/}/api/admin/releases" \
            -H "Content-Type: application/json" \
            -H "x-admin-secret: $ADMIN_SECRET" \
            --data-binary @release-payload.json \
            --output /dev/null
