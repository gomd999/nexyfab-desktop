name: Build Test (PR)

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: ESLint (errors only)
        run: npm run lint:ci

      - name: Milestone gates (M0–M7 + security)
        run: npm run verify

      - name: STEP OCCT import smoke
        run: npm run test:step-roundtrip
        timeout-minutes: 15

      - name: Install Rust (Tauri crate tests)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Tauri system deps (Linux)
        # Same Linux prerequisites as ci.yml — Tauri 2.x links against
        # WebKitGTK + GLib + GTK + AppIndicator. See tauri.app/start/prerequisites.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config

      - name: Rust cache (src-tauri)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Tauri I/O unit tests
        run: npm run test:tauri-unit
        timeout-minutes: 25
