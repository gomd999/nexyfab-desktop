name: Domain accuracy 95% certification

on:
  workflow_dispatch:
    inputs:
      evidence_dir:
        description: Directory containing <domain>.cases.json and <domain>.runs.json
        required: true
        default: docs/evidence/domain-accuracy-approved
        type: string
  workflow_call:
    inputs:
      evidence_dir:
        description: Directory containing approved five-domain evidence
        required: false
        default: docs/evidence/domain-accuracy-approved
        type: string

permissions:
  contents: read

concurrency:
  group: domain-accuracy-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-domain:
    name: Certify ${{ matrix.domain }} 95%
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        domain: [mechanical, civil, building, landscape, interior]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Verify approved cases and 3×5 campaign evidence
        shell: bash
        env:
          EVIDENCE_DIR: ${{ inputs.evidence_dir }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_DIR/$DOMAIN.cases.json"
          test -f "$EVIDENCE_DIR/$DOMAIN.runs.json"
          npm run accuracy:domain-report -- \
            --domain "$DOMAIN" \
            --cases "$EVIDENCE_DIR/$DOMAIN.cases.json" \
            --runs "$EVIDENCE_DIR/$DOMAIN.runs.json" \
            > "$DOMAIN-certification-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: domain-accuracy-${{ matrix.domain }}-certification
          path: ${{ matrix.domain }}-certification-report.json
          if-no-files-found: warn
          retention-days: 90

  certification-complete:
    name: Five-domain 95% certification complete
    runs-on: ubuntu-latest
    needs: [certify-domain]
    steps:
      - run: echo "All five independently reviewed domain campaigns satisfy the governed 95% contract."
