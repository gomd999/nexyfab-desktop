name: Domain accuracy regression matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/ai/**'
      - 'src/lib/assembly/**'
      - 'src/lib/eng-domain/**'
      - 'src/lib/brep-bridge/**'
      - 'scripts/drawing-to-3d/**'
      - 'package.json'
      - '.github/workflows/domain-accuracy-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/ai/**'
      - 'src/lib/assembly/**'
      - 'src/lib/eng-domain/**'
      - 'src/lib/brep-bridge/**'
      - 'scripts/drawing-to-3d/**'
      - 'package.json'
      - '.github/workflows/domain-accuracy-matrix.yml'

permissions:
  contents: read

concurrency:
  group: domain-accuracy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:accuracy:common

  domain:
    name: ${{ matrix.domain }} accuracy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: mechanical
            script: test:accuracy:mechanical
          - domain: civil
            script: test:accuracy:civil
          - domain: building
            script: test:accuracy:building
          - domain: landscape
            script: test:accuracy:landscape
          - domain: interior
            script: test:accuracy:interior
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run ${{ matrix.script }}
