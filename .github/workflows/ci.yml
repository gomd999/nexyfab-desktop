name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint:ci

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Parallel integration smoke (typecheck ∥ route-security ∥ STEP round-trip)
        run: npm run verify:integration-smoke
        env:
          JWT_SECRET: ci-test-secret-at-least-32-chars
          NODE_ENV: test
      - name: Milestone gates (M0–M7 + security)
        run: npm run verify
      - name: Install Rust (Tauri crate tests)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri I/O unit tests
        run: npm run test:tauri-unit
        timeout-minutes: 25
      - name: Vitest (full suite)
        run: npm run test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, security]
    env:
      JWT_SECRET: ci-test-secret-at-least-32-chars
      NEXYFAB_DB_PATH: /tmp/nexyfab-ci.db
      # next.config.ts — HTTP 127.0.0.1 E2E·standalone에서 `/_next/static` 이 https 승격되지 않도록
      # (Playwright webServer와 동일 정책; 프로덕션 HTTPS 배포는 보통 대시보드에서 재빌드·별 env).
      CSP_OMIT_UPGRADE_INSECURE: '1'
      # Google reCAPTCHA 테스트 키(로컬/127.0.0.1 허용) — CI 산출물로 `node .next/standalone/server.js` 할 때 레이아웃 스크립트 도메인 오류 방지
      # https://developers.google.com/recaptcha/docs/faq#id-like-to-run-automated-tests-with-recaptcha-what-should-i-do
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: '6LeIxAcTAAAAAGG-vFI1TnRWxMZNFUojJ4WifJWe'
      RECAPTCHA_SECRET_KEY: '6LeIxAcTAAAAAGG-vFI1TnRWxMZNFUojJ4WifJWe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
      - name: npm audit (critical only — blocks CI)
        run: npm audit --audit-level=critical

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Omit E2E_BASE_URL — CI Playwright uses 127.0.0.1:3333 (see playwright.config.ts).
          # Must satisfy startup-validation if any path runs with NODE_ENV=production (≥32 chars).
          CI: true
          JWT_SECRET: ci-e2e-jwt-secret-placeholder-32chars-min
          NODE_ENV: test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  occt-burnin:
    # OCCT WASM 10MB pull is heavy → main/master push only, plus weekly cron.
    # Catches OCCT kernel regressions (boolean determinism, parameter sweeps,
    # registry leaks, STEP round-trip drift) before they hit users.
    name: OCCT B-rep burn-in (Q1+Q2 + R1+R2)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: OCCT burn-in (pipeline + STEP round-trip + B-rep chain/extrude)
        run: npx vitest run src/app/\[lang\]/shape-generator/__tests__/pipeline.occt.burnin.test.ts src/app/\[lang\]/shape-generator/__tests__/step.roundTrip.test.ts src/app/\[lang\]/shape-generator/__tests__/pipeline.occt.chain.test.ts src/app/\[lang\]/shape-generator/__tests__/occtEngine.extrude.test.ts
        env:
          RUN_OCCT_FEASIBILITY: '1'
          NODE_ENV: test

  large-perf-bench:
    # 1k+ part synthetic-assembly perf gate. Catches O(N²) regressions in
    # feature pipeline scaling. Same gating as occt-burnin.
    name: Large-assembly perf benchmark (R3)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Large-assembly perf
        run: npx vitest run src/app/\[lang\]/shape-generator/__tests__/largeAssembly.perf.test.ts src/app/\[lang\]/shape-generator/__tests__/pipeline.perf.test.ts
        env:
          RUN_PERF_BENCH: '1'
          NODE_ENV: test

  verify-full:
    name: Full milestone verify (main/master push)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      CI: true
      JWT_SECRET: ci-test-secret-at-least-32-chars
      NEXYFAB_DB_PATH: /tmp/nexyfab-ci-verify-full.db
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npx playwright install --with-deps chromium
      - name: verify:full (milestones + Tauri + Playwright batch)
        run: npm run verify:full
        timeout-minutes: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-verify-full
          path: playwright-report/
          retention-days: 7
