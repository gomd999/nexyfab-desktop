name: CI

on:
  push:
    branches: [main, master, develop, integration/nexyfab]
  pull_request:
    branches: [main, master, integration/nexyfab]

jobs:
  migration-restore:
    name: PostgreSQL migration + restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexyfab_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexyfab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nexyfab_ci
      SOURCE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nexyfab_ci
      RESTORE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nexyfab_restore_drill
      RESTORE_DRILL_ENVIRONMENT: staging
      RESTORE_DRILL_CONFIRM: NEXYFAB_ISOLATED_RESTORE_ONLY
      RESTORE_RELEASE_BUILD_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      RESTORE_RELEASE_DEPLOYMENT_ID: github-actions-${{ github.run_id }}
      RESTORE_RELEASE_GIT_HEAD: ${{ github.sha }}
      BACKUP_FILE: /tmp/nexyfab-ci.sql.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Apply migrations twice (idempotency gate)
        run: |
          npm run migrate -- up
          npm run migrate -- up
      - name: Create backup and isolated restore target
        run: |
          pg_dump "$DATABASE_URL" | gzip > "$BACKUP_FILE"
          # createdb takes a database NAME, not a URI — passing the URL would
          # create a DB literally named "postgres://…" (and connect over the
          # local socket, not the service container). Create via the CI URL.
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nexyfab_restore_drill'
      - name: Restore drill and integrity check
        run: npm run backup:verify-restore

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint:ci

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Parallel integration smoke (typecheck ∥ route-security ∥ STEP round-trip)
        run: npm run verify:integration-smoke
        env:
          JWT_SECRET: ci-test-secret-at-least-32-chars
          NODE_ENV: test
      - name: Milestone gates (M0–M7 + security)
        run: npm run verify
      - name: Deployable slice contract tests
        run: npm run test:slices
      - name: Install Rust (Tauri crate tests)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Tauri system deps (Linux)
        # Tauri 2.x on Linux links against WebKitGTK + GLib + GTK + AppIndicator.
        # Without these, `cargo test` fails at glib-sys / gobject-sys build with
        # `pkg-config` errors. Matches the deps recommended in tauri.app/start/prerequisites.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config
      - name: Rust cache (src-tauri)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Tauri I/O unit tests
        run: npm run test:tauri-unit
        timeout-minutes: 25
      # Note: the "Vitest (full suite)" step that previously ran here was
      # removed in commit-policy.md Wave 0 follow-up (2026-05-27) because:
      #   1) It duplicates targeted vitest runs already performed by
      #      `verify:integration-smoke` (route-security + STEP roundtrip)
      #      and `verify` (M0-M7 milestone gates) above.
      #   2) It hangs indefinitely on CI (>5h before being cancelled —
      #      pre-existing on main, surfaced when wave-0 wired the Tauri
      #      apt-get fix that previously masked it). Root cause TBD — see
      #      issue in commit message.
      # Re-enable with --bail + --reporter=verbose once the hang root cause
      # is identified and fixed; track via a follow-up issue not this PR.

  robustness:
    # Foundation robustness gate (commercial-parity F2/F1/F3). Runs the fuzz +
    # degenerate-input corpus + the kernel-of-record / tolerance policy suites on
    # EVERY PR. Headless mesh path only — no OCCT WASM, no Tauri — so it is fast
    # and cannot hang like the (disabled) full vitest suite: a bounded, named set
    # of files, not a glob. A silent-empty / NaN / non-structured-throw regression,
    # or a drift in the welding tolerance, fails the build here.
    name: Robustness gate (fuzz + corpus + policies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Fuzz + degenerate corpus + foundation policies
        run: npm run test:robustness
        env:
          NODE_ENV: test

  platform-quality:
    name: Platform service, worker, container, and policy gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run ci:actions:check
      - run: npm run test:platform

  domain-accuracy:
    name: Domain accuracy (${{ matrix.domain }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: common
            script: test:accuracy:common
          - domain: mechanical
            script: test:accuracy:mechanical
          - domain: civil
            script: test:accuracy:civil
          - domain: building
            script: test:accuracy:building
          - domain: landscape
            script: test:accuracy:landscape
          - domain: interior
            script: test:accuracy:interior
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run ${{ matrix.script }}

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, robustness, platform-quality, domain-accuracy, security, migration-restore]
    env:
      JWT_SECRET: ci-test-secret-at-least-32-chars
      NEXYFAB_DB_PATH: /tmp/nexyfab-ci.db
      # next.config.ts — HTTP 127.0.0.1 E2E·standalone에서 `/_next/static` 이 https 승격되지 않도록
      # (Playwright webServer와 동일 정책; 프로덕션 HTTPS 배포는 보통 대시보드에서 재빌드·별 env).
      CSP_OMIT_UPGRADE_INSECURE: '1'
      # Google reCAPTCHA 테스트 키(로컬/127.0.0.1 허용) — CI 산출물로 `node .next/standalone/server.js` 할 때 레이아웃 스크립트 도메인 오류 방지
      # https://developers.google.com/recaptcha/docs/faq#id-like-to-run-automated-tests-with-recaptcha-what-should-i-do
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: '6LeIxAcTAAAAAGG-vFI1TnRWxMZNFUojJ4WifJWe'
      RECAPTCHA_SECRET_KEY: '6LeIxAcTAAAAAGG-vFI1TnRWxMZNFUojJ4WifJWe'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@3ab759fef4bb5935d4fe9ac68b503d05346b8364 # main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
      - name: npm audit (critical only — blocks CI)
        run: npm audit --audit-level=critical

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Omit E2E_BASE_URL — CI Playwright uses 127.0.0.1:3333 (see playwright.config.ts).
          # Must satisfy startup-validation if any path runs with NODE_ENV=production (≥32 chars).
          CI: true
          JWT_SECRET: ci-e2e-jwt-secret-placeholder-32chars-min
          NODE_ENV: test
          # playwright.config.ts's webServer launches .next/standalone/server.js
          # with NODE_ENV=production. The startup-validation in that bundle
          # FATALs unless one of DATABASE_URL / DATA_ROOT / NEXYFAB_DB_PATH
          # is set (added by Wave 0 commit b474792). Use a tmp sqlite path
          # for CI — durable enough for the test run, discarded with the
          # runner.
          NEXYFAB_DB_PATH: /tmp/nexyfab-ci-e2e.db
          # Keep the real OCCT suite on the release path. Without this env the
          # suite is skipped and a stub-only deployment can still look green.
          NEXYFAB_OCCT_REAL: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  occt-burnin:
    # OCCT WASM 10MB pull is heavy → main/master push only, plus weekly cron.
    # Catches OCCT kernel regressions (boolean determinism, parameter sweeps,
    # registry leaks, STEP round-trip drift) before they hit users.
    name: OCCT B-rep burn-in (Q1+Q2 + R1+R2)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: OCCT burn-in (pipeline + adversarial STEP + corpus + parity + leak guards)
        run: npx vitest run src/app/\[lang\]/shape-generator/__tests__/pipeline.occt.burnin.test.ts src/app/\[lang\]/shape-generator/__tests__/step.roundTrip.test.ts src/app/\[lang\]/shape-generator/__tests__/pipeline.occt.chain.test.ts src/app/\[lang\]/shape-generator/__tests__/pipeline.engineParity.burnin.test.ts src/app/\[lang\]/shape-generator/__tests__/occtCorpus.regression.test.ts src/app/\[lang\]/shape-generator/__tests__/occtEngine.extrude.test.ts src/app/\[lang\]/shape-generator/__tests__/occtEngineSelection.probe.test.ts src/app/\[lang\]/shape-generator/__tests__/selectionSurvivesParamChange.test.ts src/app/\[lang\]/shape-generator/features/stepBurnIn.test.ts src/app/\[lang\]/shape-generator/stepImport/healingStress.burnin.test.ts
        env:
          RUN_OCCT_FEASIBILITY: '1'
          NODE_ENV: test

  large-perf-bench:
    # 1k+ part synthetic-assembly perf gate. Catches O(N²) regressions in
    # feature pipeline scaling. Same gating as occt-burnin.
    name: Large-assembly perf benchmark (R3)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Large-assembly perf
        run: npx vitest run src/app/\[lang\]/shape-generator/__tests__/largeAssembly.perf.test.ts src/app/\[lang\]/shape-generator/__tests__/pipeline.perf.test.ts
        env:
          RUN_PERF_BENCH: '1'
          NODE_ENV: test

  verify-full:
    name: Full milestone verify (main/master push)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      CI: true
      JWT_SECRET: ci-test-secret-at-least-32-chars
      NEXYFAB_DB_PATH: /tmp/nexyfab-ci-verify-full.db
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npx playwright install --with-deps chromium
      - name: verify:full (milestones + Tauri + Playwright batch)
        run: npm run verify:full
        timeout-minutes: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-verify-full
          path: playwright-report/
          retention-days: 7
