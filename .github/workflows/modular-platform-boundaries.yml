name: Modular platform boundaries

on:
  push:
    branches:
      - integration/nexyfab
      - "scope/**"
    paths:
      - "apps/**"
      - "capabilities/**"
      - "config/platform/**"
      - "containers/**"
      - "domains/**"
      - "docs/evidence/platform-runtime/**"
      - "packages/**"
      - "scripts/platform/**"
      - "scripts/workspaces/**"
      - "src/lib/platform/**"
      - "src/app/api/**"
      - "workspaces/**"
      - "package.json"
      - "package-lock.json"
      - "railway.toml"
      - "wrangler.toml"
  pull_request:
    paths:
      - "apps/**"
      - "capabilities/**"
      - "config/platform/**"
      - "containers/**"
      - "domains/**"
      - "docs/evidence/platform-runtime/**"
      - "packages/**"
      - "workers/**"
      - "scripts/platform/**"
      - "scripts/workspaces/**"
      - "src/lib/platform/**"
      - "src/app/api/**"
      - "workspaces/**"
      - "package.json"
      - "package-lock.json"
      - "railway.toml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run platform:architecture:check
      - run: npm run test:slices
      - run: npm run platform:slices:readiness
      - run: npm run platform:slices:rollback:check
      - run: node --test scripts/platform/validate-platform-architecture.test.mjs
      - run: node --test scripts/platform/evaluate-runtime-placement-readiness.test.mjs
      - run: node scripts/platform/evaluate-runtime-placement-readiness.mjs --allow-hold
      - run: npx vitest run src/lib/platform/contracts.test.ts --reporter=dot
      - run: npm run typecheck
