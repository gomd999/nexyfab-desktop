name: Modular platform boundaries

on:
  push:
    branches:
      - integration/nexyfab
      - "scope/**"
    paths:
      - "apps/**"
      - "capabilities/**"
      - "config/platform/**"
      - "containers/**"
      - "domains/**"
      - "docs/evidence/platform-runtime/**"
      - "packages/**"
      - "workers/**"
      - "services/**"
      - "collab-worker/**"
      - "cron-worker/**"
      - "scripts/platform/**"
      - "scripts/workspaces/**"
      - "src/lib/platform/**"
      - "src/app/api/**"
      - "workspaces/**"
      - "package.json"
      - "package-lock.json"
      - "railway.toml"
      - "wrangler.toml"
  pull_request:
    paths:
      - "apps/**"
      - "capabilities/**"
      - "config/platform/**"
      - "containers/**"
      - "domains/**"
      - "docs/evidence/platform-runtime/**"
      - "packages/**"
      - "workers/**"
      - "services/**"
      - "collab-worker/**"
      - "cron-worker/**"
      - "scripts/platform/**"
      - "scripts/workspaces/**"
      - "src/lib/platform/**"
      - "src/app/api/**"
      - "workspaces/**"
      - "package.json"
      - "package-lock.json"
      - "railway.toml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run ci:actions:check
      - run: npm run test:platform
      - run: npm run typecheck
