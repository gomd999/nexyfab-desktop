name: Modular platform boundaries

on:
  push:
    branches:
      - integration/nexyfab
      - "scope/**"
    paths:
      - "apps/**"
      - "capabilities/**"
      - "config/platform/**"
      - "containers/**"
      - "domains/**"
      - "docs/evidence/platform-runtime/**"
      - "packages/**"
      - "workers/**"
      - "services/**"
      - "collab-worker/**"
      - "cron-worker/**"
      - "scripts/platform/**"
      - "scripts/workspaces/**"
      - "src/lib/platform/**"
      - "src/app/api/**"
      - "workspaces/**"
      - "package.json"
      - "package-lock.json"
      - "railway.toml"
      - "wrangler.toml"
  pull_request:
    paths:
      - "apps/**"
      - "capabilities/**"
      - "config/platform/**"
      - "containers/**"
      - "domains/**"
      - "docs/evidence/platform-runtime/**"
      - "packages/**"
      - "workers/**"
      - "services/**"
      - "collab-worker/**"
      - "cron-worker/**"
      - "scripts/platform/**"
      - "scripts/workspaces/**"
      - "src/lib/platform/**"
      - "src/app/api/**"
      - "workspaces/**"
      - "package.json"
      - "package-lock.json"
      - "railway.toml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run ci:actions:check
      - run: npm run test:platform
      - run: npm run typecheck
