[package]
name = "nexyfab"
version = "0.1.0"
description = "NexyFab Desktop — 제조업 CAD/CAM 설계 툴"
authors = ["Nexysys"]
edition = "2021"

[lib]
name = "nexyfab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deliberately use native OS credential stores on all desktop targets. The
# persistent Linux backend uses Secret Service/libsecret rather than a file.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
zeroize = "1.8"
uuid = { version = "1", features = ["v4"] }
