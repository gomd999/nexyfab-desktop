[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/api/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[cronJobs]]
name = "email-processor"
schedule = "*/5 * * * *"
command = "curl -s -X POST http://localhost:$PORT/api/jobs/process -H 'x-cron-secret: $CRON_SECRET'"

[[cronJobs]]
name = "quote-expiry-reminder"
schedule = "0 9 * * *"
command = "curl -s -X POST http://localhost:$PORT/api/jobs/quote-expiry-reminder -H 'x-cron-secret: $CRON_SECRET'"

[[cronJobs]]
name = "db-backup"
schedule = "0 2 * * *"
command = "curl -s -X POST http://localhost:$PORT/api/jobs/db-backup -H 'x-cron-secret: $CRON_SECRET'"

[[cronJobs]]
name = "webhook-prune"
schedule = "0 3 * * 0"
command = "curl -s -X GET http://localhost:$PORT/api/cron/webhook-prune -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "concierge-digest"
schedule = "0 8 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/concierge-digest -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "pro-grace-expiry"
schedule = "30 8 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/pro-grace-expiry -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "anti-poach-signals"
schedule = "0 9 * * 1"
command = "curl -s -X GET http://localhost:$PORT/api/cron/anti-poach-signals -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "partner-nonresponse-sla"
schedule = "0 10 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/partner-nonresponse-sla -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "payment-stuck-recovery"
schedule = "*/5 * * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/payment-stuck-recovery -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "cost-breaker-check"
schedule = "*/5 * * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/cost-breaker-check -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "demo-session-prune"
schedule = "4 0 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/demo-session-prune -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "billing-grace-prune"
schedule = "14 0 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/billing-grace-prune -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "budget-warning-prune"
schedule = "24 0 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/budget-warning-prune -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "audit-prune"
schedule = "34 0 * * 0"
command = "curl -s -X GET http://localhost:$PORT/api/cron/audit-prune -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "prompt-cost-budget"
schedule = "0 1 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/prompt-cost-budget -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "prompt-variant-burnin"
