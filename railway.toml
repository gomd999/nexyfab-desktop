schedule = "30 6 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/quote-expire -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "ops-digest"
schedule = "0 9 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/ops-digest -H 'Authorization: Bearer $CRON_SECRET'"

[[cronJobs]]
name = "order-delays"
schedule = "15 */6 * * *"
command = "curl -s -X GET http://localhost:$PORT/api/cron/order-delays -H 'Authorization: Bearer $CRON_SECRET'"
